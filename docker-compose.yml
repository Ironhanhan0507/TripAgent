services:
  postgres:
    image: postgres:16-alpine
    container_name: tripagent-postgres
    environment:
      POSTGRES_USER: tripagent
      POSTGRES_PASSWORD: tripagent_dev
      POSTGRES_DB: tripagent
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tripagent -d tripagent']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tripagent-redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: tripagent-backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://tripagent:tripagent_dev@postgres:5432/tripagent?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node dist/main"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: tripagent-frontend
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
